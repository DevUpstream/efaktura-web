# eFaktura - servisi na serverot. Slikite se gradat na GitHub Actions (ghcr.io).
name: efaktura
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 96m

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: efaktura
      POSTGRES_USER: efaktura
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      TZ: Europe/Skopje
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efaktura -d efaktura"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NEMA ports: bazata ne e dostapna od internet, samo od drugite kontejneri

  api:
    image: ghcr.io/devupstream/efaktura-api:${API_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://efaktura@db:5432/efaktura
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      PUBLIC_URL: https://${DOMAIN}
      APP_KEY_FILE: /run/secrets/app_key
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET_FILE: /run/secrets/entra_client_secret
      TZ: Europe/Skopje
    secrets: [db_password, app_key, entra_client_secret]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 256m
    # NEMA ports: dostapno samo preku Caddy (/api/*)

secrets:
  db_password:
    file: ./secrets/db_password
  app_key:
    file: ./secrets/app_key
  entra_client_secret:
    file: ./secrets/entra_client_secret

volumes:
  caddy_data:
  caddy_config:
  pgdata:
